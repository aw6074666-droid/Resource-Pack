
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка — Деканат</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            color: #1e293b;
        }

        .box {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            color: #173b70;
            font-size: 30px;
        }

        p {
            color: #64748b;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #173b70;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Упс! Ошибка</h1>

    <p>{{ message }}</p>

    <p>Произошла ошибка при обработке запроса.</p>

    <a href="/">Вернуться на главную</a>
</div>

</body>
</html>
